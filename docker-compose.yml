# ./docker-compose.yml
version: '3.8'

services:
  backend:
    # --- Automation Module: name the image so a loaded one can be used -------
    # Without an `image:` key Compose derives a name from the project folder
    # and, seeing only `build:`, rebuilds from source. On an air-gapped server
    # that build cannot fetch pip/apt/npm and fails -- while the image that was
    # transferred and `docker load`ed sits unused, because nothing connected it
    # to this service.
    #
    # With the name declared, `docker compose up -d --no-build` runs exactly
    # the transferred image. `docker compose build` still works where a build
    # is possible, and now tags its output as this same name.
    image: admin_module:latest
    build:
      context: ./ai-admin-module-py
      dockerfile: Dockerfile
      # Add proxy args for the backend build if needed (e.g., for 'pip install')
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
      # The Dockerfile's Node/Playwright step reads its proxy from
      # /run/secrets/build_proxy, not from the args above. Without this the
      # secret never arrives under compose and apt-get fetches through no
      # proxy at all -- on a corporate network that returns an interception
      # page, which apt reports as "Clearsigned file isn't valid, got
      # 'NOSPLIT'". Optional: a build with no .build-proxy file present still
      # works wherever the network needs no proxy.
      secrets:
        - build_proxy
    container_name: admin-module-py_backend
    ports:
      - "8002:8002" # Optional: useful for direct backend debugging
    volumes:
      - ./db-backup:/app/external-db
      # --- Automation Module: two optional mounts, both off by default ------
      # Neither is needed for a working deployment. Both exist so an operator
      # can change something after go-live without rebuilding the image.
      #
      # 1. app/config.json holds ai_config (BASE_URL and the endpoint list).
      #    The image ships without one -- .dockerignore excludes it -- so
      #    routers/settings.py writes a fresh file from the defaults in
      #    app/config.py on the first read. That default is correct for
      #    production, but the file it writes lives inside the container and
      #    is lost on redeploy, taking any Settings-screen change with it.
      #    Mount it to make those edits survive.
      #
      # 2. external-kb pairs with AUTOMATION_KB_PATH (see .env.example) and
      #    overrides the Knowledge Base baked into the image, for updating
      #    flow blueprints without a rebuild.
      #
      # Create the host file or directory BEFORE uncommenting: Docker creates a
      # directory where a bind-mounted file is missing, and a directory at
      # app/config.json makes the backend fail on its first settings read.
      # Both must also be writable by the container's uid:
      #     sudo chown 10001:10001 ./ai-admin-module-py/app/config.json
      #
      # - ./ai-admin-module-py/app/config.json:/app/app/config.json
      # - ./ai-admin-module-py/knowledge_base:/app/external-kb:ro
    # The image deliberately contains no .env (see ai-admin-module-py/
    # .dockerignore): baking the JWT signing key into a layer leaves it
    # readable with `docker cp`. The secrets are injected here at runtime.
    #
    # This is not optional. Without it the container starts with SECRET_KEY
    # empty, which does not fail loudly -- it issues tokens that never
    # validate, so every login breaks with no clue why. LDAP_* and the
    # Solutions token reach the app through this file too.
    #
    # Compose refuses to start when the file is missing, which is the right
    # behaviour for a secrets file: a hard stop beats a silent half-boot.
    env_file:
      - ./ai-admin-module-py/.env
    environment:
      # Listed after env_file deliberately -- `environment` takes precedence,
      # so the container's volume-mounted database wins over whatever
      # DATABASE_URL that file carries for host-local runs.
      - DATABASE_URL=sqlite:////app/external-db/admin.db
    networks:
      - existing-network
    # In development, you might want volumes for hot reloading:
    # volumes:
    #   - ./backend:/app

  frontend:
    # Same reasoning as the backend above: named so the transferred image is
    # what actually runs. Rebuilding this one air-gapped is doubly impossible,
    # since its first stage runs `npm install`.
    image: ai_test_frontend:latest
    build:
      context: ./ai-test-assistant-frontend
      dockerfile: Dockerfile
      # Pass proxy variables from your host environment to the build stage
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        # --- Automation Module: the API base must be a BUILD arg ------------
        # Vite inlines VITE_API_URL into the JavaScript at build time, so this
        # is the line that decides where every user's browser sends its API
        # calls. The `environment:` entry below cannot do it -- by run time
        # nginx is serving a bundle with the URL already compiled in.
        #
        # The frontend Dockerfile fails the build when this is empty rather
        # than quietly falling back to the developer .env, which carries
        # http://127.0.0.1:8002.
        - VITE_API_URL=${VITE_API_URL:-https://dx12348.etisalat.corp.ae/admin/}
    container_name: ai-test-assistant_frontend
    environment:
      # Kept for parity with existing deployments. Has no effect on the served
      # bundle -- see the build arg above.
      - VITE_API_URL=${VITE_API_URL:-https://dx12348.etisalat.corp.ae/admin/}
        # Pass proxy variables to the running container environment as well
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
    ports:
      - "5173:5173" # Map host port 3000 to container Nginx port 80
    depends_on:
      - backend
    networks:
      - existing-network

# Build-time only. Never mounted into a running container, and never written
# into a layer or into `docker history` -- that is the whole point of routing
# the credential through a BuildKit secret rather than a build arg.
secrets:
  build_proxy:
    file: ./ai-admin-module-py/.build-proxy

networks:
  existing-network:
    external: true
    name: test_case_assistant-master_default
